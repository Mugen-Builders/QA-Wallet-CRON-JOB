# Build the Docker image and publish it to the GitHub Container Registry (GHCR) under the org,
# so the bot can be deployed from a prebuilt image (fly.io, any container host) instead of building
# from source each time. Runs the test suite first, so only green commits produce an image.
#
# Image: ghcr.io/mugen-builders/qa-wallet-cron-job
# Tags:  latest (main), <branch>, sha-<short>, and semver (vX.Y.Z -> X.Y.Z and X.Y) on tags.
#
# One-time org setup: the default GITHUB_TOKEN can publish packages, but the package is created on
# the first successful run and starts PRIVATE. To let others pull it, make the package public (or
# grant access) in the org's Packages settings, and ensure Settings -> Actions -> Workflow
# permissions allows read/write (this workflow also requests packages: write explicitly below).
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase; hardcoded (github.repository keeps the repo's mixed case).
  IMAGE_NAME: mugen-builders/qa-wallet-cron-job

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # fly.io runs amd64; add linux/arm64 here if you also want Apple-silicon local pulls.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
